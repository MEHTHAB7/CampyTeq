services:
  postgres:
    image: postgres:16-alpine
    container_name: campyteq_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campyteq_db}
      POSTGRES_USER: ${POSTGRES_USER:-campyteq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campyteq_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campyteq_user} -d ${POSTGRES_DB:-campyteq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - campyteq_internal

  redis:
    image: redis:7-alpine
    container_name: campyteq_prod_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - campyteq_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campyteq_prod_backend
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_demo &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 60"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-campyteq_user}:${POSTGRES_PASSWORD:-campyteq_secure_password_2026}@postgres:5432/${POSTGRES_DB:-campyteq_db}
      - REDIS_URL=redis://redis:6379/1
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,api.campyteq.edu,campyteq.edu}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost,https://campyteq.edu}
    volumes:
      - static_volume:/var/www/static
      - media_volume:/var/www/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - campyteq_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campyteq_prod_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
    depends_on:
      - backend
    networks:
      - campyteq_internal

  nginx:
    image: nginx:1.27-alpine
    container_name: campyteq_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - campyteq_internal

  cv-service:
    build:
      context: ./cv-service
      dockerfile: Dockerfile
    container_name: campyteq_prod_cv_simulator
    restart: unless-stopped
    environment:
      - API_BASE_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    networks:
      - campyteq_internal

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  campyteq_internal:
    driver: bridge
